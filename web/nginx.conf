server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;   # React Router support
  }

  # React calls /api/... -> forwarded to the AI engine
  location /api/ {
    proxy_pass http://ai-engine:8000/;
    proxy_read_timeout 300s;      # agent deliberation can be slow
  }
}
